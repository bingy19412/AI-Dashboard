<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0705;--tx:#f6ece0;--mu:#b9a48f;--a:#ff8a1f;--b:#ffd27a;--bd:rgba(255,200,140,.16);--gl:rgba(255,235,210,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Sora',system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(60% 50% at 15% 20%,rgba(255,140,40,.22),transparent 70%),radial-gradient(50% 45% at 85% 75%,rgba(255,90,20,.18),transparent 70%),linear-gradient(160deg,#150d08,#07090c 70%)}
.bg .scene{position:absolute;inset:-5%;z-index:0;background-size:cover;background-position:center;filter:blur(4px) brightness(.68) saturate(.9);opacity:0;transform:scale(1.06);transition:opacity 5s ease-in-out}
.bg .scene.active{opacity:.68}
.bg .scene-1{background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80')}
.bg .scene-2{background-image:url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1600&q=80')}
.bg .scene-3{background-image:url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=80')}
.bg .scene-4{background-image:url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=80')}
.bg .scene-5{background-image:url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80')}
.bg .scene-6{background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80')}
.bg::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(15,9,5,.48),rgba(4,7,10,.58))}
.bg i{position:absolute;z-index:2;border-radius:50%;filter:blur(40px);background:radial-gradient(circle,rgba(255,190,100,.55),transparent 65%);animation:bk 20s ease-in-out infinite alternate}
.bg i:nth-of-type(1){width:260px;height:260px;left:6%;top:10%}.bg i:nth-of-type(2){width:200px;height:200px;right:8%;top:6%;animation-delay:-7s}.bg i:nth-of-type(3){width:320px;height:320px;left:40%;bottom:-8%;animation-delay:-12s;opacity:.6}
@keyframes bk{to{transform:translate(40px,-30px) scale(1.2)}}
main{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:20px 18px 40px}
#web{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
#web path{fill:none;stroke:rgba(255,170,80,.45);stroke-width:1;stroke-dasharray:4 7;animation:fl 2.4s linear infinite}
#web circle{fill:var(--b);filter:drop-shadow(0 0 5px var(--a))}
@keyframes fl{to{stroke-dashoffset:-22}}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px;position:relative;z-index:2}
h1{margin:0;font-size:clamp(1.4rem,3vw,2rem);font-weight:600;letter-spacing:.02em}
h1 span{color:var(--a)}
.sub{color:var(--mu);font-size:.85rem;margin-top:3px}
#clock{text-align:right;font-size:1.5rem;font-weight:600}#clock small{display:block;color:var(--mu);font-weight:300;font-size:.75rem}
.glass{position:relative;z-index:2;background:linear-gradient(145deg,rgba(255,235,210,.11),rgba(255,235,210,.03));border:1px solid var(--bd);border-radius:22px;padding:16px;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .25s ease,border-color .25s;animation:in .8s cubic-bezier(.2,.8,.2,1) both;overflow:hidden;--mx:50%;--my:0%}
.glass::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,190,110,.2),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.glass:hover{border-color:rgba(255,170,80,.45)}.glass:hover::before{opacity:1}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(6px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{padding:12px 16px;display:flex;flex-direction:column}.stat b{font-size:1.7rem;font-weight:600;color:var(--b)}.stat span{font-size:.75rem;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.layout{display:grid;grid-template-columns:1fr minmax(340px,1.15fr) 1fr;gap:18px;align-items:start;position:relative}
.col{display:grid;gap:16px}
h2{margin:0 0 12px;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:1px solid var(--a)}
button{cursor:pointer;border:1px solid var(--bd);background:rgba(255,235,210,.08);border-radius:12px;padding:8px 12px;transition:.2s}
button:hover{background:rgba(255,160,60,.2);border-color:var(--a);transform:translateY(-1px)}
.pri{background:linear-gradient(90deg,var(--a),#ff5d1f);border:0;color:#1a0d02;font-weight:600}
.pri:hover{background:linear-gradient(90deg,#ffa23e,#ff6d2f);box-shadow:0 0 18px rgba(255,138,31,.5)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.form>:first-child,.form>.pri{grid-column:1/-1}
.list{max-height:250px;overflow:auto}
.task{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid transparent;margin-bottom:7px;animation:in .4s both;transition:.2s}
.task:hover{border-color:var(--bd);transform:translateX(3px)}
.task.done{opacity:.4;text-decoration:line-through}
.task .m{flex:1;min-width:0;font-size:.9rem;overflow-wrap:anywhere}.task small{color:var(--mu);font-size:.72rem}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--a);padding:0}
.x{padding:1px 8px;border:0;background:none;color:var(--mu)}
.tag{font-size:.65rem;padding:1px 7px;border-radius:99px;border:1px solid var(--a);color:var(--a);margin-left:4px}.tag.late{border-color:#ff5470;color:#ff5470}
.empty{color:var(--mu);font-size:.85rem;font-style:italic}
.orbwrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center}
#orbbox{position:relative;width:min(100%,430px);aspect-ratio:1;animation:lev 7s ease-in-out infinite;cursor:pointer;transition:transform .3s}
#orbbox:hover{transform:scale(1.03)}
@keyframes lev{50%{translate:0 -16px}}
#orb{position:absolute;inset:0;width:100%;height:100%;display:block}
.next{text-align:center;max-width:420px;font-size:.9rem;margin:-6px 0 12px;color:var(--b)}
.chat{width:100%;padding:14px}
#chat{height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;scrollbar-width:thin}
.msg{padding:9px 12px;border-radius:16px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem;line-height:1.5;animation:in .4s both}
.me{align-self:flex-end;background:linear-gradient(90deg,var(--a),#ff5d1f);color:#1a0d02;font-weight:400}
.ai{align-self:flex-start;background:rgba(0,0,0,.28);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{font-size:.75rem;padding:5px 11px;border-radius:99px}
.row{display:flex;gap:8px}
.ring{position:relative;width:130px;height:130px;margin:0 auto 10px}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bgc{stroke:rgba(255,255,255,.1)}.ring .fg{stroke:var(--a);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--a));transition:stroke-dashoffset 1s linear}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:600}
.presets{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.presets button{padding:4px 12px;font-size:.8rem}
.club{margin-bottom:9px}.club .t{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px;align-items:center}
.club button{padding:0 8px;line-height:1.3}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--a)}
.note{padding:8px 10px;border-left:2px solid var(--a);background:rgba(0,0,0,.2);border-radius:0 12px 12px 0;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;overflow-wrap:anywhere;animation:in .4s both}
.exam{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.2);margin-bottom:6px;font-size:.88rem;gap:8px}.exam b{color:var(--b);font-weight:600;white-space:nowrap}
[hidden]{display:none!important}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:relative;z-index:2}
nav button{border-radius:99px;padding:6px 14px;font-size:.82rem}
nav button.on{background:linear-gradient(90deg,var(--a),#ff5d1f);color:#1a0d02;border:0;font-weight:600}
.pg{max-width:820px;margin:0 auto;position:relative;z-index:2}
.pgh{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.pgh .tt{font-size:1.6rem;font-weight:600;background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;flex:1}
.pgh .em{width:58px;font-size:1.5rem;text-align:center}
.blk{margin-bottom:12px;padding-top:14px}
.blk .ctl{position:absolute;top:6px;right:8px;display:flex;opacity:0;transition:.2s;z-index:3}.blk:hover .ctl{opacity:1}
@media(hover:none){.blk .ctl{opacity:.8}}
.blk textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;color:var(--tx);resize:none;overflow:hidden;min-height:90px;line-height:1.6}
.blk textarea:focus{outline:1px solid var(--a)}
.bh{font-size:1.2rem;font-weight:600;background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0}
.ci{display:flex;gap:8px;align-items:center;margin-bottom:6px}.ci input:not([type=checkbox]){background:none;border:0;flex:1}.ci input.dn{text-decoration:line-through;opacity:.5}
.blk a{color:var(--b);text-decoration:none}.blk a:hover{text-decoration:underline}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.addbar{margin-top:6px}
input:not([type]),textarea{padding-right:38px!important}
.subt{min-height:58px;max-width:440px;text-align:center;font-size:1.05rem;font-weight:400;line-height:1.5;margin:-8px 0 4px;position:relative;z-index:3}
.subt.in{animation:su .45s cubic-bezier(.2,.8,.2,1) both}
.subt span{opacity:.3;transition:opacity .25s,text-shadow .25s,color .25s;display:inline-block}
.subt span.on{opacity:1;color:var(--b);text-shadow:0 0 14px rgba(255,170,80,.6)}
.subt.me{font-style:italic;color:var(--mu)}
@keyframes su{from{opacity:0;transform:translateY(10px);filter:blur(5px)}}
.vbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;position:relative;z-index:3}
.vbar button{font-size:.8rem;border-radius:99px;padding:6px 14px}
.vbar button.on{background:linear-gradient(90deg,var(--a),#ff5d1f);color:#1a0d02;border:0}
.rec{animation:rc 1.2s ease-in-out infinite!important}
@keyframes rc{0%{box-shadow:0 0 0 0 rgba(255,138,31,.7)}70%,100%{box-shadow:0 0 0 14px rgba(255,138,31,0)}}
.fm{position:fixed;z-index:60;width:28px;height:28px;padding:0;border-radius:50%;font-size:.8rem}
.sk{width:100%;border-radius:12px;background:rgba(0,0,0,.25);display:block}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.orbwrap{order:-1}#web{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bg .scene{transition:none}.bg .scene-1.active{opacity:.68}}
</style>
</head>
<body>
<div class="bg"><span class="scene scene-1 active"></span><span class="scene scene-2"></span><span class="scene scene-3"></span><span class="scene scene-4"></span><span class="scene scene-5"></span><span class="scene scene-6"></span><i></i><i></i><i></i></div>
<main id="main">
<svg id="web"></svg>
<header>
 <div><h1>Dashboard</h1><div class="sub" id="greet"></div></div>
 <div id="clock"></div>
</header>
<nav id="nav"></nav>
<div id="home">
<section class="stats">
 <div class="glass stat"><b id="s1">0</b><span>Pending</span></div>
 <div class="glass stat"><b id="s2">0</b><span>Due in 48h</span></div>
 <div class="glass stat"><b id="s3">0h</b><span>Effort queued</span></div>
 <div class="glass stat"><b id="s4">0m</b><span>Focused today</span></div>
</section>
<div class="layout">
 <div class="col">
  <section class="glass" data-link style="animation-delay:.1s">
   <h2>Task Queue</h2>
   <div class="form">
    <input id="tt" placeholder="What’s due?">
    <select id="ts"><option>AP Calc</option><option>AP CSA</option><option>AP Chem</option><option>APUSH</option><option>Web Dev</option><option>Club</option><option>Other</option></select>
    <select id="te"><option value="0.5">Quick · 30m</option><option value="1" selected>Medium · 1h</option><option value="2">Heavy · 2h</option><option value="3">Beast · 3h</option></select>
    <input id="td" type="datetime-local" aria-label="Due">
    <button class="pri" id="add">Add task</button>
   </div>
   <div class="list" id="tasks"></div>
  </section>
  <section class="glass" data-link style="animation-delay:.25s">
   <h2>Tests &amp; Projects</h2>
   <div class="form"><input id="en" placeholder="AP Chem Unit 5 test"><input id="ed" type="date" aria-label="Test date"><button id="ea">Add</button></div>
   <div id="exams"></div>
  </section>
 </div>
 <div class="orbwrap">
  <div id="orbbox" title="Talk to your brain"><canvas id="orb"></canvas></div>
  <div id="sub" class="subt"></div>
  <div class="next" id="next"></div>
  <div class="vbar"><button id="jm" class="pri" hidden>🎙 Talk to Jarvis</button><button id="vt">🔊 Voice on</button><button id="bpb">✦ Project blueprint</button></div>
  <section class="glass chat" style="animation-delay:.4s">
   <div class="chips">
    <button data-p="Plan my afternoon and evening today with time blocks, using my pending tasks.">Plan today</button>
    <button data-p="Give me my Status Snapshot.">Snapshot</button>
    <button data-p="Flag deadline conflicts or risks in the next week.">Spot risks</button>
    <button data-p="Quiz me with 3 quick practice problems on the subject with my nearest deadline.">Drill me</button>
   </div>
   <div id="chat"></div>
   <div class="row"><input id="ci" placeholder="Ask your brain anything…"><button class="pri" id="send">Send</button></div>
  </section>
 </div>
 <div class="col">
  <section class="glass" data-link style="animation-delay:.15s">
   <h2>Focus Session</h2>
   <div class="ring"><svg width="130" height="130"><circle class="bgc" cx="65" cy="65" r="58"/><circle class="fg" id="fg" cx="65" cy="65" r="58" stroke-dasharray="364.4" stroke-dashoffset="0"/></svg><div id="tm">25:00</div></div>
   <div class="presets"><button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button></div>
   <div class="row"><button class="pri" id="go" style="flex:1">Start</button><button id="rs">Reset</button></div>
  </section>
  <section class="glass" data-link style="animation-delay:.3s">
   <h2>Club Hours</h2><div id="clubs"></div>
  </section>
  <section class="glass" data-link style="animation-delay:.45s">
   <h2>Brain Dump</h2>
   <div class="row" style="margin-bottom:10px"><input id="ni" placeholder="Idea, reminder, anything…"><button id="na">Save</button></div>
   <div class="list" id="notes" style="max-height:140px"></div>
  </section>
 </div>
</div>
</div>
<div class="pg" id="pagev" hidden></div>
<div class="ov" id="dlg" hidden><div class="glass" style="width:min(92vw,420px)"><h2>New page</h2><div class="form"><input id="dn" placeholder="Page name (e.g. APUSH Notes)"><input id="de" placeholder="Icon" value="📄" maxlength="4"><select id="dt"><option value="blank">Blank</option><option value="project">Project</option><option value="notes">Class notes</option></select><button class="pri" id="dc">Create page</button><button id="dx" style="grid-column:1/-1">Cancel</button></div></div></div>
<div class="ov" id="sdlg" hidden><div class="glass" style="width:min(92vw,460px)"><h2>Settings</h2>
<div class="sub" style="margin-bottom:8px">Anthropic API key, only needed outside claude.ai. Saved in this browser only and sent only to api.anthropic.com.</div>
<input id="ak" type="password" placeholder="sk-ant-…" autocomplete="off" style="margin-bottom:8px">
<div class="row" style="margin-bottom:14px"><button class="pri" id="aks" style="flex:1">Save key</button><button id="akc">Remove</button></div>
<h2>Your data</h2><div class="row" style="margin-bottom:10px"><button id="ex" style="flex:1">Export</button><button id="im" style="flex:1">Import</button><input type="file" id="imf" accept=".json" hidden></div>
<div class="sub" id="sst" style="min-height:18px"></div><button id="sx" style="width:100%;margin-top:8px">Close</button></div></div>
<button id="fm" class="fm" hidden aria-label="Dictate">🎙</button>
</main>
<script>
const CTX=`You are Jarvis, Parker Bingaman’s personal academic planner (11th grade), like a sharp friendly study partner with light wit and casual sarcasm. Be direct and concise, no filler. Classes: AP Calc AB/BC (daily), AP CSA (M,T,Th,F), AP Chem (M,T,Th,F), APUSH (M,T,W,F), Web Dev (virtual). School 8am-4pm; occasional volunteering and band in afternoons. Best focus 4-8pm, worst 8pm onward. Prefers practice problems, quick review, short sessions. Recurring: Web Dev week’s assignments due Fridays 4pm; AP Chem review HW due Tuesday 4pm the week of that unit’s test; Calc and APUSH review HW due before each unit test. Assume 3 free hours weekdays, 5 weekends. Never overschedule. Use time blocks with specific start times and short breaks. Flag conflicts early. End any planning with a Status Snapshot (done, pending with deadlines, what to do first next time). Apply his corrections for the rest of the chat.`;
const scenes=[...document.querySelectorAll(".bg .scene")];let sceneIndex=0;
setInterval(()=>{const previous=scenes[sceneIndex];sceneIndex=(sceneIndex+1)%scenes.length;const next=scenes[sceneIndex];next.classList.add("active");setTimeout(()=>previous.classList.remove("active"),5000)},10*60*1000);
const CLUBS={"Beta Club":8,"Tri-M":12,"NHS":20,"NEHS":11,"Science NHS":10,"NTHS":8};
let S={pages:[],cur:"home",tasks:[],exams:[],notes:[],clubs:{},chat:[],focus:{}};
try{const r=localStorage.getItem("sb2");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("sb2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk=()=>new Date().toDateString();

function tick(){const d=new Date(),h=d.getHours();
 $("clock").innerHTML=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"<small>"+d.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})+"</small>";
 $("greet").textContent=(h<12?"Morning":h<17?"Afternoon":"Evening")+", Parker. "+(h>=16&&h<20?"Prime focus window. Use it.":h>=20||h<6?"Dead zone. Sleep counts as studying.":"School hours. Survive first.")}
tick();setInterval(tick,30000);

const dueOf=t=>t.due?new Date(t.due):null;
function render(){
 const now=Date.now(),open=S.tasks.filter(t=>!t.done).sort((a,b)=>(dueOf(a)||9e15)-(dueOf(b)||9e15));
 $("tasks").innerHTML=open.concat(S.tasks.filter(t=>t.done)).map(t=>{const d=dueOf(t);let g="";
  if(d&&!t.done){const df=d-now;g=df<0?'<span class="tag late">overdue</span>':df<48*36e5?'<span class="tag">soon</span>':""}
  return `<div class="task ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} data-c="${t.id}" aria-label="done"><div class="m">${esc(t.t)}${g}<br><small>${esc(t.s)} · ${t.e}h${d?" · "+d.toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}</small></div><button class="x" data-x="${t.id}" aria-label="delete">✕</button></div>`}).join("")||'<div class="empty">Nothing here. Suspiciously peaceful.</div>';
 $("s1").textContent=open.length;
 $("s2").textContent=open.filter(t=>{const d=dueOf(t);return d&&d-now<48*36e5}).length;
 $("s3").textContent=open.reduce((a,t)=>a+ +t.e,0)+"h";
 $("s4").textContent=(S.focus[dk()]||0)+"m";
 const nx=open.find(t=>dueOf(t));
 $("next").textContent=nx?`Next up: ${nx.t} — ${nx.s}, due ${dueOf(nx).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})}`:open.length?`Next up: ${open[0].t}`:"All clear. Add something or enjoy the quiet.";
 S.exams.sort((a,b)=>a.d.localeCompare(b.d));

 sOff=[];let o=0;el.innerHTML=s.split(" ").map(w=>{sOff.push(o);o+=w.length+1;return `<span>${esc(w)}</span>`}).join(" ");
 sw=[...el.children];let k=0;subT=setInterval(()=>{if(gotB||k>=sw.length){clearInterval(subT);return}sw[k++].classList.add("on")},340)}
const hl=ci=>{gotB=true;sw.forEach((w,i)=>w.classList.toggle("on",sOff[i]<=ci))};
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));for(const p of [/daniel/i,/google uk english male/i,/arthur/i,/oliver/i,/alex/i,/male/i,/en-gb/i]){const f=v.find(x=>p.test(x.name)||p.test(x.lang));if(f)return f}return v[0]||null}
function stopSay(){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();vm=0;showSub("")}
function say(t){if(!("speechSynthesis" in window))return;stopSay();
 const ss=(String(t).replace(/[*_#`>]/g,"").match(/[^.!?\n]+[.!?]*/g)||[]).map(s=>s.trim()).filter(Boolean),v=pickVoice();
 ss.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s);if(v)u.voice=v;u.rate=1.04;u.pitch=.92;
  u.onstart=()=>{vm=.7;showSub(s)};u.onboundary=e=>hl(e.charIndex);
  u.onend=u.onerror=()=>{if(i===ss.length-1){vm=0;setTimeout(()=>{if(!speechSynthesis.speaking)showSub("")},1200)}};
  speechSynthesis.speak(u)})}
if(!("speechSynthesis" in window))$("vt").hidden=true;
$("vt").onclick=()=>{speakOn=!speakOn;$("vt").textContent=speakOn?"🔊 Voice on":"🔇 Voice off";if(!speakOn)stopSay()};

Promise.resolve().then(()=>claude.use("dictation")).catch(()=>null).then(d=>d||webSR()).then(d=>{if(!d)return;D=d;
 d.onPartial(({text})=>{if(dt==="j")showSub(text,"me")});
 d.onFinal(({text})=>{if(dt==="j")acc+=(acc?" ":"")+text;else if(dt){const sp=dt.value&&!/\s$/.test(dt.value)?" ":"";dt.value+=sp+text;dt.dispatchEvent(new Event("input",{bubbles:true}))}});
 d.onState(({state})=>{const on=state==="listening",j=dt==="j";
  $("jm").classList.toggle("rec",on&&j);$("fm").classList.toggle("rec",on&&!j);
  if(j){vm=on?.5:0;$("jm").textContent=on?"⏹ Listening…":"🎙 Talk to Jarvis"}
  if(!on){if(j){const q=acc.trim();acc="";showSub("");if(q)ask(q,true)}dt=null}});
 $("jm").hidden=false}).catch(()=>{});
$("jm").onclick=()=>{if(!D)return;if(dt==="j"){D.stop();return}if(dt)return;stopSay();dt="j";acc="";D.start().catch(()=>{dt=null;showSub("")})};
const OKT=el=>el&&(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&(el.type==="text"||el.type==="")&&el.offsetWidth>120));
function placeFm(el){const r=el.getBoundingClientRect(),f=$("fm");f.style.left=Math.min(innerWidth-36,r.right-34)+"px";f.style.top=(el.tagName==="TEXTAREA"?r.top+6:r.top+(r.height-28)/2)+"px"}
const hideFm=()=>{$("fm").hidden=true};
document.addEventListener("focusin",e=>{if(!D)return;const el=e.target;if(OKT(el)){fe=el;$("fm").hidden=false;placeFm(el)}else if(el.id!=="fm")hideFm()});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!dt&&document.activeElement!==$("fm"))hideFm()},250));
addEventListener("scroll",()=>{if(fe&&!$("fm").hidden)placeFm(fe)},true);
$("fm").onmousedown=e=>e.preventDefault();
$("fm").onclick=()=>{if(!D||!fe)return;if(dt){D.stop();return}dt=fe;D.start().catch(()=>{dt=null})};

const BPP=`Create a project blueprint page for this student's project. Return ONLY JSON: {"title":"short title","emoji":"one emoji","blocks":[...]}. Block formats: {"k":"h","v":"Heading"}, {"k":"t","v":"paragraph text"}, {"k":"c","items":[{"x":"task text","d":false}]}, {"k":"p","v":0}, {"k":"s","v":"<svg ...>"}. Include in order: Overview (h+t); Goal and success criteria (h+t); a Sketch (h+s): a simple labeled diagram, wireframe or architecture picture as standalone SVG, viewBox 0 0 600 320, no scripts, strokes #ffb86b, text fill #f6ece0, font-size 14, transparent background, boxes and arrows with short labels; Milestones (h+c) with realistic short steps sized for about 3 free hours on weekdays; Step-by-step guide (h+t); Ideas (h+c); Risks and unknowns (h+t); Things to look up (h+t, no URLs); finally a progress block. Keep prose tight, under 700 words excluding the SVG.`;
function clean(j){const B=[];for(const b of (j.blocks||[]).slice(0,30)){
 if(b.k==="h"||b.k==="t")B.push({k:b.k,v:String(b.v||"")});
 else if(b.k==="c")B.push({k:"c",items:(b.items||[]).slice(0,20).map(i=>({x:String(i&&i.x||i),d:false}))});
 else if(b.k==="p")B.push({k:"p",v:Math.max(0,Math.min(100,+b.v||0))});
 else if(b.k==="s"&&/^\s*<svg/i.test(b.v)&&!/<script|onload|onerror|<foreignObject|href/i.test(b.v))B.push({k:"s",v:String(b.v)})}
 return B}
async function blueprint(desc,voice){busy=true;think=1;bp=false;$("bpb").classList.remove("on");$("ci").placeholder=PH;
 S.chat.push({role:"user",content:desc},{role:"assistant",content:"Drafting your blueprint…"});drawChat();let n="";
 try{const sm=await SM();if(!sm)throw{message:"Add your API key in ⚙ Settings, or open this page through claude.ai."};
  const j=await sm.json(BPP+"\n\nSTUDENT: "+CTX+"\nTODAY: "+new Date().toDateString()+"\nPROJECT: "+desc);
  const blocks=clean(j);if(blocks.length<3)throw{message:"the blueprint came back empty"};
  const p={id:uid(),n:String(j.title||"Project").slice(0,40),e:String(j.emoji||"🚀").slice(0,4),blocks};S.pages.push(p);
  n=`Done. I built “${p.n}” with a plan, a sketch and milestones. Opening it now.`;S.chat[S.chat.length-1].content=n;
  if(voice&&speakOn)say(n);setTimeout(()=>go(p.id),1500)}
 catch(e){S.chat[S.chat.length-1].content="Blueprint failed: "+(e.message||"something broke")+". Try again with a bit more detail."}
 busy=false;think=0;save();drawChat()}
$("bpb").onclick=()=>{bp=!bp;$("bpb").classList.toggle("on",bp);$("ci").placeholder=bp?"Describe your project, then hit Send…":PH;$("ci").focus()};
const stt=m=>{$("sst").textContent=m};
$("aks").onclick=()=>{const k=$("ak").value.trim();try{localStorage.setItem(KEYN,k)}catch(e){stt("Couldn’t save in this browser.");return}stt(k?"Key saved. Jarvis can use it now.":"Nothing to save.")};
$("akc").onclick=()=>{try{localStorage.removeItem(KEYN)}catch(e){}$("ak").value="";stt("Key removed.")};
$("sx").onclick=()=>$("sdlg").hidden=true;
$("ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="dashboard-data.json";a.click();stt("Export started.")};
$("im").onclick=()=>$("imf").click();
$("imf").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());for(const k of ["pages","tasks","exams","notes","clubs","chat","focus"])if(j[k]!==undefined)S[k]=j[k];S.cur="home";save();render();drawChat();go("home");stt("Imported.")}catch(x){stt("That file didn’t look right.")}};
render();drawChat();go(S.cur||"home");
